name: Multitool

options:
  bundleIdPrefix: com.multitool
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: pl

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel
    minorVersion: 0.12.1
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.5.1
  swift-nio-ssh:
    url: https://github.com/Wellz26/swift-nio-ssh
    minorVersion: 0.3.4
  swift-nio:
    url: https://github.com/apple/swift-nio
    from: 2.81.0

targets:
  Multitool:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Multitool
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: Citadel
      - package: SwiftTerm
      - package: swift-nio-ssh
        product: NIOSSH
      - package: swift-nio
        product: NIOCore
      - package: swift-nio
        product: NIOPosix
    info:
      path: Multitool/Info.plist
      properties:
        CFBundleDisplayName: Multitool
        CFBundleDevelopmentRegion: pl
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSFaceIDUsageDescription: Multitool używa Face ID do odblokowania aplikacji i ochrony kluczy SSH.
        NSLocalNetworkUsageDescription: Multitool łączy się z serwerami SSH, SFTP i FTP w Twojej sieci lokalnej.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleURLTypes:
          - CFBundleURLName: com.multitool.app.links
            CFBundleURLSchemes:
              - ssh
              - sftp
              - multitool
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.multitool.app
        PRODUCT_NAME: Multitool
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
    scheme: {}
