name: Build iOS (unsigned IPA)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Wybierz najnowszy Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Zainstaluj XcodeGen
        run: brew install xcodegen

      - name: Wygeneruj projekt Xcode
        run: xcodegen generate

      - name: Pobierz pakiety Swift
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Multitool.xcodeproj \
            -scheme Multitool \
            -skipPackagePluginValidation \
            -skipMacroValidation

      - name: Zbuduj (bez podpisu)
        run: |
          set -o pipefail
          xcodebuild \
            -project Multitool.xcodeproj \
            -scheme Multitool \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Spakuj IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Multitool.app Payload/
          zip -qry Multitool-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Multitool-unsigned-ipa
          path: Multitool-unsigned.ipa
